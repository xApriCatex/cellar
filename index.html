    font-family: var(--fb); color: var(--ink); -webkit-tap-highlight-color: transparent; }
  .n, #coins, .buy, .btn, .ticket, table td:last-child, .num { font-family: var(--fb); font-variant-numeric: lining-nums tabular-nums; }
  #stage { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; overflow: hidden; background: var(--paper); box-shadow: 0 0 0 1px var(--ink); }
  #cv { position: absolute; left: 0; top: 0; width: 390px; height: 844px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus:not(:focus-visible) { outline: none; }
  button:focus-visible { outline: 2px solid var(--red); outline-offset: 1px; }
  img.coin { width: 1em; height: 1em; vertical-align: -.15em; }
  svg.mk { width: .78em; height: .78em; vertical-align: -.02em; margin-right: .12em; overflow: visible; }   /* a coin in running text; places with their own size keep it */
  .key { position: absolute; font: 8px/1 var(--fb); letter-spacing: .04em; color: var(--paper); background: var(--grey); padding: 2px 3px 1px; pointer-events: none; }
  .nokeys .key { display: none; }
  .small { font-size: 13.5px; color: var(--grey); line-height: 1.4; }
  .grow { flex: 1; min-width: 0; }
  .tag { font: 12.5px var(--fsc); letter-spacing: .08em; color: var(--red); border: 1px solid var(--red); padding: 0 4px; vertical-align: 2px; }

  /* the masthead: coins, the rate, reputation; an Oxford rule beneath (2px, then a hairline 3px below) */
  #top { position: absolute; left: 0; top: 0; width: 390px; height: 41px; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box; border-bottom: 2px solid var(--ink); background: var(--paper); z-index: 2; }
  #top::after { content: ''; position: absolute; left: 0; right: 0; bottom: -5px; height: 0; border-bottom: 1px solid var(--ink); }
  #top img { width: 22px; height: 22px; }
  #coins { font-size: 22px; line-height: 1; min-width: 64px; }
  #coins.ink { animation: ink .22s ease-out; } @keyframes ink { from { filter: blur(1.5px); } }
  /* the takings a minute sit in the middle of the masthead, where a paper prints its price */
  #rate { flex: 1; text-align: center; font: italic 15px var(--fd); color: var(--ink); white-space: nowrap; }
  #rate .n { font-size: 18px; font-style: normal; }
  #rep { font: 12.5px var(--fsc); letter-spacing: .08em; color: var(--red); }
  #gear { width: 34px; height: 34px; position: relative; display: flex; align-items: center; justify-content: center; }
  #gear img { width: 24px; height: 24px; }
  #gear .key { right: -2px; bottom: -2px; }

  /* the caption under the drawing, Punch style: role in italics, then the line */
  #caption { position: absolute; left: 18px; right: 18px; top: 608px; height: 30px; display: flex; align-items: center; justify-content: center; text-align: center;
    font: 13.5px/1.2 var(--fd); color: var(--ink); pointer-events: none; text-wrap: balance; }

  /* the stage line, in the caption's place until every stage is open: the stage, its next step, how far along */
  #goal { position: absolute; left: 12px; right: 12px; top: 584px; height: 53px; display: none; flex-wrap: wrap; align-content: flex-end; align-items: center; column-gap: 8px; row-gap: 0; padding: 0 2px 5px; border: 0; background: none; color: var(--ink); text-align: left; cursor: pointer; }
  #goal.on { display: flex; }
  #goal .st, #goal .tx, #goal .ct { text-shadow: 0 0 2px var(--paper), 0 0 3px var(--paper), 0 0 5px var(--paper); }
  #goal .st { flex-basis: 100%; font: 12.5px/1.2 var(--fsc); letter-spacing: .08em; color: var(--red); white-space: nowrap; }
  #goal .tx { font: 15px/1.15 var(--fd); flex: 1 1 auto; min-width: 0; }
  #goal .ct { font: italic 13px/1.2 var(--fd); color: var(--grey); margin-left: auto; text-align: right; font-variant-numeric: tabular-nums; }
  #goal .ct img { width: 13px; height: 13px; vertical-align: -2px; margin-right: 3px; }
  /* the line is a button: a small pointer says so */
  #goal::after { content: '\203A'; font: 18px/1 var(--fd); color: var(--red); margin-left: -2px; }
  #goal .bar { position: absolute; left: 0; right: 0; bottom: 2px; height: 4px; margin: 0; }
  .ledger.steps tr.done td { color: var(--grey); }
  .btn .was { display: block; font: italic 13px var(--fd); color: inherit; opacity: .75; }

  /* the notes at the grating: a stop-press slip under the masthead, one line a note; it folds to its heading */
  #caller { position: absolute; left: 10px; right: 10px; top: 52px; z-index: 3; background: var(--paper); border: 1px solid var(--ink); outline: 1px solid var(--ink); outline-offset: 2px; padding: 3px 8px 4px; display: none; }
  #caller.on { display: block; animation: slip .2s cubic-bezier(.2, .8, .2, 1); }
  #caller .hd { display: flex; width: 100%; justify-content: space-between; align-items: baseline; background: none; border: 0; padding: 2px 0; font: 12.5px var(--fsc); letter-spacing: .08em; color: var(--red); cursor: pointer; text-align: left; }
  #caller .hd .fo { font: italic 13px var(--fd); letter-spacing: 0; color: var(--grey); text-decoration: underline; }
  #caller .nr { display: flex; gap: 8px; align-items: center; min-height: 30px; border-top: 1px dotted var(--grey); }
  #caller .tx { flex: 1; min-width: 0; background: none; border: 0; padding: 3px 0; text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: italic 14px/1.25 var(--fd); color: var(--ink); }
  #caller img { width: 13px; height: 13px; vertical-align: -2px; margin: 0 2px 0 1px; }
  #caller .none { font: italic 13.5px var(--fd); color: var(--grey); white-space: nowrap; }
  #caller .btn { font-size: 13.5px; padding: 2px 9px; white-space: nowrap; }
  #caller .btn .key { right: -5px; top: -7px; }

  /* the bench: small advertisements under the drawing */
  #bench { position: absolute; left: 0; top: 640px; width: 390px; height: 134px; border-top: 1px solid var(--ink); background: var(--paper); display: flex; gap: 7px; padding: 8px 9px; box-sizing: border-box; }
  .card { position: relative; flex: 1 1 0; min-width: 0; border: 1px solid var(--ink); background: var(--paper); padding: 6px 8px 5px; display: flex; flex-direction: column; gap: 2px; text-align: left; transition: transform .05s; }
  .card:active { transform: translate(1px, 1px); }
  .card .nm { font: 16.5px/1.05 var(--fd); }
  .card .ds { font: italic 13px/1.25 var(--fd); color: var(--grey); flex: 1; overflow: hidden; }
  /* a price you can pay sits on an ochre ticket, the colour of every "yes" button; one you cannot is hatched and grey,
     with roughly how long until you can */
  .card .buy { font-size: 15px; display: flex; align-items: center; gap: 4px; color: var(--ink); }
  .card .buy .p { display: inline-flex; align-items: center; gap: 4px; }
  .card.can .buy .p { background: var(--ochre); border: 1px solid var(--ink); padding: 1px 5px 0; margin: -2px -3px -1px 0; }
  .nw { white-space: nowrap; }
  .card .eta { font: italic 13px var(--fd); color: var(--grey); }
  .card .buy .lead { flex: 1; border-bottom: 1.5px dotted var(--grey); margin: 0 2px 4px 0; }
  .card .buy img { width: 14px; height: 14px; }
  .card .buy .pic { display: inline-flex; align-items: flex-end; height: 26px; margin: -6px 0 -1px -2px; min-width: 0; flex-shrink: 1; overflow: hidden; }
  .card .buy .p { flex-shrink: 0; }   /* a long price squeezes the picture, never spills out of the card */
  .card .buy .pic img { width: auto; height: 22px; }
  .card .buy .pic.tall { height: 34px; margin-top: -4px; }
  .card .buy .pic.tall img { height: 36px; margin: 0 -4px -2px -6px; }
  .card .buy .pic.ch img { height: 19px; width: auto !important; }
  .card .buy .pic.ch img + img { margin-left: -12px; }
  .card.cant .buy .pic { opacity: .75; }
  .card.cant { background: var(--hatch), var(--paper); }
  .card.cant .buy { color: var(--grey); }
  .card .key { right: 3px; top: 3px; }
  .card.goal { border-style: dashed; background: var(--paper); }
  .card.goal .nm { font: 13px var(--fsc); letter-spacing: .07em; color: var(--grey); }
  .card.goal .ds { font: 15px/1.2 var(--fd); color: var(--ink); font-style: normal; flex: 1; }
  .card.goal .bar { margin: 0 0 4px; }
  .card.goal .buy { color: var(--grey); }

  /* tabs: the contents strip; the open page is paper with a short red rule under its name */
  #tabs { position: absolute; left: 0; top: 774px; width: 390px; height: 70px; display: flex; border-top: 2px solid var(--ink); background: var(--paper2); }
  .tab { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-right: 1px solid rgba(42, 36, 32, .45); }
  .tab:last-child { border-right: 0; }
  .tab img { width: 32px; height: 32px; }
  .tab .tn { font: 12.5px var(--fsc); letter-spacing: .08em; }
  .tab.on { background: var(--paper); }
  .tab.on .tn::after { content: ''; display: block; height: 2px; margin: 1px 2px 0; background: var(--red); transform: rotate(-1.2deg); }
  .tab .dot { position: absolute; top: 5px; right: calc(50% - 25px); font: 17px/1 var(--fd); color: var(--red); display: none; }
  .tab .dot::before { content: '\2020'; }
  .tab.new .dot { display: block; }
  .tab .key { right: 4px; top: 4px; }

  /* full pages over the cellar (Map, Book, Show, Shop) */
  #panel { position: absolute; left: 0; top: 46px; width: 390px; height: 728px; background: var(--paper); display: none; overflow-y: auto; padding: 12px 16px 24px; box-sizing: border-box; touch-action: pan-y; }
  #panel.on { display: block; }
  #panel.in { animation: fadein .12s ease-out; }
  h2 { font: 26px/1.1 var(--fd); margin: 0 0 4px; text-wrap: balance; }
  #panel > h2 { border-bottom: 2px solid var(--ink); padding-bottom: 3px; box-shadow: 0 3px 0 -2px var(--paper), 0 4px 0 -2px var(--ink); margin-bottom: 8px; }
  h3 { font: 15px var(--fsc); letter-spacing: .08em; margin: 18px 0 2px; border-bottom: 1px solid var(--ink); padding-bottom: 2px; }
  .sub { font: italic 13.5px/1.35 var(--fd); color: var(--grey); margin-bottom: 8px; }
  ol.how { margin: 0 0 10px; padding-left: 20px; font-size: 13.5px; line-height: 1.4; } ol.how li { margin: 3px 0; }
  .rowc { display: flex; gap: 10px; align-items: center; border-top: 1px solid rgba(42, 36, 32, .35); padding: 9px 0; }
  .rowc .pic { width: 64px; height: 50px; flex: 0 0 64px; display: flex; align-items: flex-end; justify-content: center; }
  .rowc .pic img, .rowc .pic canvas { max-width: 64px; max-height: 50px; }
  .rowc .nm { font: 18px/1.15 var(--fd); }
  .rowc .ds { font-size: 13px; line-height: 1.38; color: var(--grey); }
  .rowc .num { font-size: 13px; color: var(--ink); margin-top: 2px; line-height: 1.35; }
  .rowc .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .rowc.dim .pic { opacity: .6; }
  .rowc.dim .nm { color: var(--grey); }
  .stars { color: var(--red); font-size: 14px; margin-left: 5px; letter-spacing: 1px; vertical-align: 1px; }
  .ros { color: var(--red); font-size: 14px; margin-left: 5px; }
  .btn { position: relative; border: 1px solid var(--ink); background: var(--paper); font-size: 14.5px; padding: 5px 11px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; transition: transform .05s; }
  .btn:active { transform: translate(1px, 1px); }
  .btn img { width: 14px; height: 14px; }
  .btn.red { background: var(--ochre); }
  /* the chalk label on a wheel's card: what the place makes next */
  .next { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin: -2px 0 8px; font: 12.5px var(--fsc); letter-spacing: .05em; color: var(--grey); }
  .next span { margin-right: 2px; }
  .btn.chip { font-size: 13px; padding: 1px 7px; }
  .btn.chip.on { background: var(--ink); color: var(--paper); }
  .btn[disabled] { color: var(--grey); border-color: var(--grey); background: var(--hatch), var(--paper); cursor: default; }
  .btn .key { right: -5px; top: -7px; }
  .linkb { font: italic 13px var(--fd); color: var(--red); text-decoration: underline; }
  .bar { display: block; height: 6px; border: 1px solid var(--ink); overflow: hidden; margin: 4px 0 10px; background: var(--paper); }
  .bar i { display: block; height: 100%; background: var(--ochre); }
  .pips i { display: inline-block; width: 8px; height: 8px; border: 1px solid var(--ink); border-radius: 50%; margin-left: 3px; vertical-align: 2px; }
  .pips i.on { background: var(--ink); }
  .back { font: 14px var(--fsc); letter-spacing: .06em; color: var(--red); margin-bottom: 6px; }
  .rack { display: flex; gap: 10px; align-items: flex-start; border-top: 1px solid rgba(42, 36, 32, .35); padding: 10px 0; }
  .rack .pic { width: 64px; flex: 0 0 64px; padding-top: 6px; }
  .rack .pic img { max-width: 64px; }
  .rack .nm { font: 18px/1.15 var(--fd); }
  .rack .ds { font-size: 13.5px; color: var(--grey); margin: 2px 0 4px; line-height: 1.35; }
  .rack table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 6px; }
  .rack td { padding: 2px 0; border-bottom: 1px solid rgba(42, 36, 32, .2); }
  .rack td:last-child { text-align: right; }
  .rack .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .rack .nm + .acts { margin: 6px 0 8px; } /* a rack's buttons sit under its name, where they stay put */
  .rack.empty .rowc:first-of-type { border-top: 0; }
  .rack.empty .rowc .pic { width: 48px; flex-basis: 48px; }
  .ad { border: 1px solid var(--ink); padding: 9px 10px; margin-bottom: 8px; }
  .ticket { font-size: 20px; color: var(--red); border: 1px solid var(--red); padding: 4px 8px; transform: rotate(-2deg); }

  /* the map: the cut-away drawing, each chamber a tappable box with a paper label */
  .map { position: relative; margin: 2px auto 6px; }
  .map > img { display: block; }
  .mrack { position: absolute; pointer-events: none; }
  .cham { position: absolute; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; padding: 2px; }
  .cham .cn, .cham .cs { background: var(--paper); border: 1px solid var(--ink); padding: 0 5px; }
  .cham .cn { font: 13px var(--fsc); letter-spacing: .06em; }
  .cham .cs { font: italic 13px/1.3 var(--fd); border-top: 0; }
  .cham .minis { position: absolute; left: 6%; right: 6%; top: 18%; display: flex; gap: 2px; justify-content: center; flex-wrap: wrap; pointer-events: none; }
  .cham .minis img { width: 24px; }
  .cham.here { border: 1.5px dashed var(--red); }
  .cham.dark .cs { font-style: normal; font-size: 16px; }
  .cham.dig .btn { font-size: 13px; padding: 3px 7px; margin-top: 2px; }
  .cham.dig .bar { width: 80%; margin: 2px 0 0; }

  /* the card on a wheel: a cheese label, double rule */
  #pop { position: absolute; left: 12px; width: 366px; box-sizing: border-box; display: none; z-index: 4; padding: 9px 12px 11px; border: 3px double var(--ink); background: var(--paper); max-height: 520px; overflow-y: auto; }
  #pop.on { display: block; animation: slip .18s cubic-bezier(.2, .8, .2, 1); }
  #pop .nm { font: 20px var(--fd); padding-right: 24px; }
  #pop .ds { font-size: 13px; line-height: 1.38; color: var(--grey); margin: 2px 0 6px; }
  #pop table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 8px; }
  #pop td { padding: 2px 0; border-bottom: 1px solid rgba(42, 36, 32, .2); vertical-align: top; }
  #pop td:first-child { white-space: nowrap; padding-right: 10px; }
  #pop td:last-child { text-align: right; }
  #pop .acts { display: flex; gap: 7px; justify-content: flex-end; flex-wrap: wrap; }
  #pop .x { position: absolute; right: 6px; top: 3px; font: 24px/1 var(--fd); padding: 2px 6px; }
  #pop .rowc:first-of-type { border-top: 0; }
  .clim { display: inline-block; font: 12px var(--fsc); letter-spacing: .06em; border: 1px solid var(--ink); padding: 0 4px; margin-left: 5px; vertical-align: 2px; }
  .clim.off { color: var(--red); border-color: var(--red); }

  /* modal cards (introductions, the away report, options) */
  #modal { position: absolute; inset: 0; z-index: 6; background: rgba(42, 36, 32, .42); display: none; align-items: center; justify-content: center; }
  #modal.on { display: flex; }
  #box { width: 324px; max-height: 720px; overflow-y: auto; box-sizing: border-box; padding: 16px 18px; border: 3px double var(--ink); background: var(--paper); text-align: center; }
  #box.in { animation: paper .2s cubic-bezier(.2, .8, .2, 1); }
  #box p { font-size: 14px; line-height: 1.45; margin: 8px 0; }
  #box .small { font-size: 13.5px; }
  #box .kicker { font: 12.5px var(--fsc); letter-spacing: .1em; color: var(--red); margin-bottom: 2px; }
  #box .pic { height: 90px; display: flex; align-items: flex-end; justify-content: center; margin: 4px 0 6px; }
  #box .pic img, #box .pic canvas { max-height: 90px; max-width: 160px; }
  #box .acts { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  #box label { display: flex; align-items: center; gap: 10px; font: 15px var(--fd); margin: 10px 0; text-align: left; }
  #box label.chk { font-size: 14px; }
  #box input[type=range] { flex: 1; accent-color: var(--red); }
  /* the key table in Options */
  #box textarea { width: 100%; height: 96px; box-sizing: border-box; font: 11px/1.3 ui-monospace, Consolas, monospace; border: 1px solid var(--ink); background: var(--paper2); color: var(--ink); resize: none; -webkit-user-select: text; user-select: text; }
  #keys { text-align: left; margin-top: 12px; border-top: 1px solid var(--ink); padding-top: 6px; }
  #keys .kh { font: 13px var(--fsc); letter-spacing: .08em; }
  #keys .kr { display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 14px var(--fd); padding: 2px 0; border-bottom: 1px dotted var(--grey); }
  #keys .kr .btn { min-width: 46px; justify-content: center; }
  .ledger { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13.5px; text-align: left; }
  .ledger td { padding: 3px 0; border-bottom: 1px solid rgba(42, 36, 32, .25); }
  .ledger td:last-child { text-align: right; }
  .ledger tr.tot td { border-top: 1.5px solid var(--ink); border-bottom: 3px double var(--ink); font-size: 15px; }
  .ledger img { width: 13px; height: 13px; vertical-align: -1px; margin-right: 3px; }
  .cultpic { display: flex; justify-content: center; margin: 4px 0 2px; }
  .cultpic img { max-width: 110px; max-height: 90px; }
  .stampbig { color: var(--red); font-size: 30px; letter-spacing: 4px; transform: rotate(-5deg); animation: thump .14s ease-out; }
  .caps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .capb { border: 1px solid var(--ink); padding: 7px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; font: 14px var(--fd); }
  .capb i { width: 34px; height: 14px; border: 1px solid var(--ink); border-radius: 50% 50% 3px 3px; }
  .capb em { font: italic 12.5px/1.2 var(--fd); color: var(--grey); }
  .capb.on { outline: 2px solid var(--red); outline-offset: 1px; }
  .capb[disabled] { background: var(--hatch), var(--paper); color: var(--grey); }

  #toast { pointer-events: none; position: absolute; left: 50%; bottom: 264px; transform: translateX(-50%); z-index: 5; max-width: 340px; font: italic 14.5px/1.3 var(--fd); padding: 5px 14px; border: 1px solid var(--ink); background: var(--paper); display: none; text-align: center; }
  #toast.on { display: block; animation: slip .2s cubic-bezier(.2, .8, .2, 1); }
  /* an honour on the slip: its seal at the left, the name in small capitals; a tap opens the Roll */

<script>
// Cellar rules: pure state and numbers, no drawing. Shared by the game page and tools/sim.js.
// window.CL: newState, step, make, sell, turn, buySlot, hire, learn, refine, dig, offline, worth, stage, ...
// A wheel's place `at` is a shelf space (0-11, the cellar picture) or a rack in a chamber ('cold:2').
(function (root) {
  const C = root.CFG;
  const SLOTS = C.slotOrder.length;
  const CH = {}; for (const c of C.chambers) CH[c.id] = c;

  function newState() {
    const s = {
      v: 4, coins: 0, earned: 0, t: 0, cellar: 'old',
      slots: new Array(SLOTS).fill(null), open: C.startSlots, ch: {},
      learned: { curd: true }, hired: {}, busy: {}, lv: {}, stats: { sold: {}, best: {}, made: 0, served: 0 }, seen: {}, ev: [],
      notes: [], noteNext: { now: C.notes.first }, show: null,
      rule: {},  // how Pip sells each shelf ('sh0'-'sh2') or rack: unset = when ripe, 'vintage' = when Vintage (a kept batch: never)
      label: {}, // what each shelf ('sh0'-'sh2') or rack makes again after a sale (its chalk label); unset = the same as the wheels sold
      // what outlasts selling the cellar: lifetime sales (the Book's stars), reputation, family secrets, rosettes
      life: { sold: {}, earned: 0, rep: 0, repSpent: 0, secrets: {}, runs: 0, rosettes: {}, best: {}, parts: 0, machines: {}, stage: 1,
        season: { now: null, pick: null, n: {}, done: {} }, fittings: 0, played: 0,
        cultures: {}, found: 0, cultureIn: 0 },  // cultures held, cultures ever found, seconds until the next can turn up
    };
    for (const c of C.chambers) s.ch[c.id] = { dug: !c.dig, digEnd: null, n: c.start, r: new Array(c.racks).fill(null) };
    // the cellar is handed over with a shelf of curds already ready
    for (let n = 0; n < C.startSlots; n++) s.slots[C.slotOrder[n]] = wheel('curd', C.cheeses.curd.ready);
    return s;
  }
  function wheel(kind, age) {
    const c = C.cheeses[kind];
    return { kind, age: age || 0, q: 0, due: false, next: c.turn > 0 ? c.turn : Infinity };
  }

  // ---- places ----
  const isRack = (at) => typeof at === 'string';
  const split = (at) => { const k = at.indexOf(':'); return [at.slice(0, k), +at.slice(k + 1)]; };
  function get(s, at) { if (!isRack(at)) return s.slots[at]; const [id, j] = split(at); return s.ch[id] ? s.ch[id].r[j] : null; }

  const chamberOpen = (s, id) => !!(s.ch[id] && s.ch[id].dug && CH[id].opens(s));
  function isOpen(s, at) {

  // ---- stages: each opens one new idea; s.life.stage is kept for good (selling the cellar never closes one) ----
  const stageNo = (s) => s.life.stage || 1;
  const reached = (s, n) => stageNo(s) >= n;
  const turningOn = (s) => reached(s, C.at.turning);
  function stepHave(s, st) {

      case 'spaces': return [Math.min(s.open, st.n), st.n];
      // once Moss is hired he turns every shelf first, so turning by hand is counted done (it could never finish)
      case 'turned': return s.hired.moss ? [st.n, st.n] : [Math.min(s.life.turnedByHand || 0, st.n), st.n];
      case 'sold': return [Math.min(s.life.sold[st.k] || 0, st.n), st.n];
      case 'laid': return [(s.life.sold[st.k] || 0) > 0 || places(s).some((p) => isRack(p) && get(s, p) && get(s, p).kind === st.k) ? 1 : 0, 1];
      case 'aged': return [(s.life.sold[st.k] || 0) > 0 || places(s).some((p) => isRack(p) && get(s, p) && get(s, p).kind === st.k && get(s, p).age >= C.cheeses[st.k].ready) ? 1 : 0, 1];
      // likewise once Pip is hired a batch sold by hand counts done (he sells every ripe shelf before a finger can)
      case 'batch': if (st.hand && s.hired.pip) return [1, 1]; return [Math.min((s.life[st.hand ? 'handBatches' : 'batches'] || {})[st.k] || 0, 1), 1];
      case 'served': return [Math.min((s.life.served || 0) + (s.stats.served || 0), st.n), st.n];
      case 'entered': return [Math.min(s.life.entered || 0, 1), 1];
      case 'retired': return s.life.runs ? [1, 1] : [Math.min(s.earned, C.rep.per), C.rep.per];
      case 'built': return grade(s, st.id) ? [1, 1] : [Math.min(s.life.parts || 0, MACH[st.id].grades[0]), MACH[st.id].grades[0]];

  }
  const stepDone = (s, st) => { const [h, n] = stepHave(s, st); return h >= n && (st.t !== 'learn' || !!s.learned[st.k]) && (st.t !== 'hire' || !!s.hired[st.id]) && (st.t !== 'retired' || s.life.runs > 0) && (st.t !== 'built' || grade(s, st.id) > 0); };
  // the stage now open and its steps; null once every stage is open
  function goal(s) {
    const n = stageNo(s), g = C.stages[n - 1]; if (!g) return null;

  }
  const gradeCount = (s) => C.machines.reduce((a, m) => a + grade(s, m.id), 0);
  function checkStage(s, quiet) {

    let g = C.stages[stageNo(s) - 1];

    }
  }

  const houseCount = (s) => C.house.filter((h) => s.learned[h.id]).length;
  // a save from before the second act's stages (callers and the Show were one stage then): the stage number moves up one
  function syncStages(s) { if (s.life.fittings > 0) { for (let i = 0; i < s.life.fittings; i++) s.life.parts = (s.life.parts || 0) + Math.round(5 * Math.pow(1.4, i)); s.life.fittings = 0; } if (!(s.v >= 4)) { if ((s.life.stage || 1) >= 6) s.life.stage++; s.v = 4; } for (const k of ['cultures']) s.life[k] = s.life[k] || {}; s.life.found = s.life.found || 0; s.life.luck = s.life.luck || 0;
    // the secret "Pip comes along" was cut (Pip always comes now): its 2 reputation come back
    if (s.life.secrets && s.life.secrets.pip) { delete s.life.secrets.pip; s.life.repSpent = Math.max(0, (s.life.repSpent || 0) - 2); }
    // and "A night ledger" (the clock does its job): its 2 come back too (review part 8)
    if (s.life.secrets && s.life.secrets.ledger) { delete s.life.secrets.ledger; s.life.repSpent = Math.max(0, (s.life.repSpent || 0) - 2); }
    if (s.life.runs > 0) s.hired.pip = true;

  // long cheeses age in the chambers' racks, each only in its own room (`needs`), the rest on the cellar shelves
  const fitsPlace = (kind, at) => { const c = C.cheeses[kind]; return isRack(at) ? !!c.long && c.needs === split(at)[0] : !c.long; };
  // each shelf has its own air (`shelfAir`), felt from the Cave air stage on; each room below has its chamber's
  const CELL = {}; for (const c of C.cellars) CELL[c.id] = c;
  const cellarOf = (s) => CELL[s.cellar] || CELL.old;
  const shelfAir = (s, n) => cellarOf(s).air[n];
  const climOf = (s, at) => (isRack(at) ? CH[split(at)[0]].clim : climateOpen(s) ? shelfAir(s, Math.floor(at / 4)) : null);
  // how fast a wheel ages here: its air (airRate) times the family's reputation (ageSpeed)
  const rate = (s, kind, at) => airRate(s, kind, at) * ageSpeed(s);
  // reputation makes every wheel ripen faster, by `age` for each doubling of it, up to `ageMax` (owner, 2026-10-08: each new
  // cellar caught up the last in half to two thirds of the time, held back by ageing, not money; worth alone could not fix it)
  const ageSpeedOf = (rep) => Math.min(C.rep.ageMax || 1, 1 + (C.rep.age || 0) * Math.log2(1 + (rep || 0)));
  const ageSpeed = (s) => ageSpeedOf(s.life.rep);
  function airRate(s, kind, at) {
    const c = C.cheeses[kind], cl = at === undefined ? null : climOf(s, at);

    return g ? Math.max(C.offClimate, MACH.bellows.rate[g - 1]) : C.offClimate;
  }

  const workshopOpen = (s) => s.life.runs > 0 && reached(s, C.at.workshop);
  // ---- the year: eight days, four seasons of two, each a festival with one cheese in season ----
  const seasonOpen = (s) => workshopOpen(s);   // errands pay in parts, which mean nothing before the Workshop
  const seasonState = (s) => (s.life.season = s.life.season || { n: {}, done: {} });
  const ofCheese = (x, kind) => { const c = C.cheeses[kind]; return !!x && !!c && (kind === x.cheese || c.parent === x.cheese); };
  // the cellar's year: the page sets it from the clock (the simulator has none); the season in it puts one cheese in season

  const yearSeason = (s) => { const L = seasonState(s); return seasonOpen(s) && L.turn != null ? C.seasons[((L.turn % 4) + 4) % 4] : null; };
  const inSeason = (s, kind) => ofCheese(yearSeason(s), kind);
  const seasonOf = yearSeason;   // the festival is the season

  // ---- the Workshop's machines (kept in s.life, so they outlast selling the cellar) ----
  const grade = (s, id) => (s.life.machines && s.life.machines[id]) || 0;
  const MACH = {}; for (const m of C.machines) MACH[m.id] = m;
  // the shelves the turning rig covers (0 top, 1 middle, 2 bottom); a shelf space i is on shelf floor(i / 4)
  const rigShelves = (s) => MACH.rig.shelves.slice(0, grade(s, 'rig'));
  const rigged = (s, at) => !isRack(at) && rigShelves(s).includes(Math.floor(at / 4));
  const turnMult = (s, at) => (rigged(s, at) ? MACH.rig.mult : 1) * (isRack(at) ? 1 : cellarOf(s).turn || 1);
  const capOf = (s, at, kind) => C.cheeses[kind].cap * turnMult(s, at);
  const machineOpen = (s, id) => workshopOpen(s) && reached(s, MACH[id].stage || C.at.workshop);
  const allBuilt = (s) => C.machines.every((m) => grade(s, m.id) >= m.grades.length);
  // parts are only for machines: once every machine is finished, none come any more
  const gainParts = (s, n) => { if (!allBuilt(s)) s.life.parts = (s.life.parts || 0) + n; };
  function build(s, id) {
    const m = MACH[id], g = grade(s, id), cost = m && m.grades[g];
    if (!m || !machineOpen(s, id) || cost === undefined || (s.life.parts || 0) < cost) return false;
    s.life.parts -= cost; s.life.machines = s.life.machines || {}; s.life.machines[id] = g + 1;
    s.ev.push({ t: 'built', id, g: g + 1 }); return true;
  }

  // ---- worth ----
  // base worth (0 before it is ready): climbs straight from v0 at ready to v1 at peak; after the peak it keeps creeping
  // up to `vintage` more by three times the peak age. Nothing ever spoils.
  function value(kind, age, q) {
    const c = C.cheeses[kind];
    if (age < c.ready) return 0;
    const f = c.peak <= c.ready ? 1 : Math.min(1, (age - c.ready) / (c.peak - c.ready));
    const vf = age > c.peak && !c.fresh ? Math.min(1, (age - c.peak) / (2 * Math.max(c.peak, 1))) : 0;
    return (c.v0 + (c.v1 - c.v0) * f) * (1 + C.vintage * vf) * (1 + (q || 0));
  }
  // the Book's stars: lifetime wheels of a kind sold, against that cheese's own scale (curds sell by the hundred)
  const starAt = (kind, n) => Math.max(1, Math.round(C.stars[n] * (C.cheeses[kind].starScale || 1)));
  const stars = (s, kind) => { const n = s.life.sold[kind] || 0; let k = 0; while (k < C.stars.length && n >= starAt(kind, k)) k++; return k; };
  const nextStar = (s, kind) => { const k = stars(s, kind); return k < C.stars.length ? starAt(kind, k) : null; };
  // every star in the Book, of any cheese, makes every cheese worth more: work on an old cheese is never wasted
  const allStars = (s) => C.order.reduce((a, k) => a + stars(s, k), 0);
  const repLeft = (s) => s.life.rep - s.life.repSpent;
  // family secrets: most are known once; a ranked one (`grow`) is bought again and again, each rank dearer
  const RANKED = C.secrets.filter((x) => x.grow);
  const secretCost = (s, x) => (x.grow ? x.cost * Math.pow(x.grow, +s.life.secrets[x.id] || 0) : x.cost);
  // the cellar's recipe level: one ladder for every cheese (as Egg, Inc.'s research serves every egg)
  const recipeLv = (s) => s.lv.all || 0;
  // everything that multiplies a cheese's worth: recipe level, Book stars, reputation, rosettes
  function mult(s, kind) {

  }

  function ageWheels(s, dt) {

      if (!w.due && turningOn(s) && w.age >= w.next && w.age < c.peak && w.q < capOf(s, at, w.kind) - 1e-9) w.due = true;

    }

        if (at === null) { s.busy[a.id] = 0; break; }

      }
    }
  }
  // Pip sells what has peaked (or, on a shelf set to Vintage, what has gone Vintage), except a batch you are keeping
  const sellAge = (s, at, kind) => { const c = C.cheeses[kind]; return (s.rule || {})[groupOf(at)] === 'vintage' && !c.fresh ? 3 * c.peak : c.peak; };
  function findPeak(s) { for (const at of places(s)) { const w = get(s, at); if (w && !w.keep && w.age >= sellAge(s, at, w.kind) - 1e-9) return at; } return null; }
  // a bare rack, or a whole bare shelf, with a cheese chalked on it (a shelf falls back to curd while the coins are short)
  function findBare(s) {

  }

  }

  const labelOf = (s, at) => s.label[groupOf(at)] || (batchOf(s, at)[0] !== undefined && get(s, batchOf(s, at)[0]).kind) || null;
  function again(s, at, kind, by) {
    const k = s.label[groupOf(at)] || kind; if (make(s, at, k, by)) return true;

    return true;
  }
  function setLabel(s, at, kind) { if (!s.learned[kind] || !fitsPlace(kind, at)) return false; s.label[groupOf(at)] = kind; return true; }
  function pay(s, v) { s.coins += v; s.earned += v; s.life.earned += v; }
  function tally(s, w, v) {
    const before = stars(s, w.kind);
    s.stats.sold[w.kind] = (s.stats.sold[w.kind] || 0) + 1;
    s.life.sold[w.kind] = (s.life.sold[w.kind] || 0) + 1;
    s.stats.best[w.kind] = Math.max(s.stats.best[w.kind] || 0, v);
    s.life.best[w.kind] = Math.max(s.life.best[w.kind] || 0, v);
    if (stars(s, w.kind) > before) s.ev.push({ t: 'star', kind: w.kind, n: stars(s, w.kind) });
    // the festival's errand: wheels of its cheese, sold in its season (the count keeps from one year to the next)
    const x = ofCheese(yearSeason(s), w.kind) && yearSeason(s), L = s.life.season;

    }

  // selling sells the whole batch on the shelf (every wheel ready); one event for the lot
  function sell(s, at, by) {

      const w = get(s, p), x = worth(s, w); if (x <= 0) continue;

    }
    if (!is.length) return 0;
    if (stage(w0.kind, w0.age) === 'vintage') s.life.vintage = (s.life.vintage || 0) + is.length;
    if (!by && w0.keep && !C.cheeses[w0.kind].fresh && w0.age >= 10 * C.cheeses[w0.kind].peak) s.life.forgot = true;
    culture(s, w0, by);   // one chance for the whole batch (its wheels are all the same age)
    if (!isRack(at)) for (const k of by ? ['batches'] : ['batches', 'handBatches']) { const B = (s.life[k] = s.life[k] || {}); B[w0.kind] = (B[w0.kind] || 0) + 1; }
    ev(s, { t: 'sold', kind: w0.kind, stg: stage(w0.kind, w0.age), coins: v, by, peak: w0.age >= C.cheeses[w0.kind].peak, is: isRack(at) ? undefined : is, n: is.length }, is[0]);
    return v;
  }
  // an old batch (cultureDrop.minAge x its ripe age or more) may give a culture: always the first time, then once the
  // cellar's clock for the next (cultureDrop.hours, running while you are away too) has run out. One you hold already
  // goes to a neighbour for a part
  const cultureIn = (s) => Math.max(0, s.life.cultureIn || 0);
  // coins hurry the next making (owner, 2026-10-09, from the review: late on, coins had nothing to buy): hurry.hours off
  // its clock a time, at most hurry.max times a making, for hurry.min minutes of the cellar's takings (x1.5 each time)
  const hurryLeft = (s) => (reached(s, C.at.cultures) && s.life.found && cultureIn(s) > 0 ? C.hurry.max - (s.life.hurried || 0) : 0);
  const hurryCost = (s) => Math.max(1, Math.round(C.hurry.min * 60 * Math.max(cellarRate(s), s.rateHi || 0) * Math.pow(1.5, s.life.hurried || 0)));
  function hurry(s) {
    if (hurryLeft(s) <= 0) return false; const cost = hurryCost(s); if (s.coins < cost) return false;
    s.coins -= cost; s.life.cultureIn = Math.max(0, cultureIn(s) - C.hurry.hours * 3600); s.life.hurried = (s.life.hurried || 0) + 1; return true;
  }
  function culture(s, w, by) {
    const c = C.cheeses[w.kind], D = C.cultureDrop;

    const L = s.life;

    // a culture not yet found comes first; only once all are found does a spare turn up
    const have = (x) => L.cultures[x] || C.house.some((h) => h.culture === x && s.learned[h.id]);
    const left = C.cultures.filter((x) => !have(x.id)), pool = left.length ? left : C.cultures;
    const id = pool[Math.floor(Math.random() * pool.length)].id;
    if (have(id)) { gainParts(s, 1); s.ev.push({ t: 'culture', id, dup: true }); return; }
    L.cultures[id] = 1; L.found = (L.found || 0) + 1; s.ev.push({ t: 'culture', id });
  }
  // a culture on a cheese: if it is the right one, a house cheese is founded (and the culture is used up); if not,
  // nothing happens and the culture is kept
  function found(s, cul, parent) {
    if (!s.life.cultures[cul] || !s.learned[parent]) return null;
    const h = C.house.find((x) => x.culture === cul && x.parent === parent);
    if (!h) { s.ev.push({ t: 'nottaken', id: cul, parent }); return false; }
    delete s.life.cultures[cul]; s.learned[h.id] = true; s.ev.push({ t: 'founded', kind: h.id }); return h.id;
  }
  // turning turns every wheel of the batch that asks
  function turn(s, at, by) {
    const is = [];
    for (const p of batchOf(s, at)) {
      const w = get(s, p); if (!w.due) continue;
      const c = C.cheeses[w.kind], m = turnMult(s, p);
      w.q = Math.min(c.cap * m, w.q + c.bonus * m); w.due = false; w.next = w.age + c.turn; is.push(p);
    }
    if (!is.length) return false;
    if (!by) s.life.turnedByHand = (s.life.turnedByHand || 0) + 1;   // the stage 2 lesson: once by hand before Moss
    ev(s, { t: 'turned', kind: get(s, is[0]).kind, by, is: isRack(at) ? undefined : is }, is[0]);
    return true;
  }
  function keep(s, at, on) {
    const b = batchOf(s, at); if (!b.length) return false;
    const v = on === undefined ? !get(s, b[0]).keep : !!on; for (const p of b) get(s, p).keep = v; return true;
  }
  // the shelf's rule for Pip, from the wheel's card: 'ripe', 'vintage' (both kept for every batch after) or 'keep' (this batch)
  const ruleOf = (s, at) => { const b = batchOf(s, at); return b.length && b.every((p) => get(s, p).keep) ? 'keep' : (s.rule || {})[groupOf(at)] || 'ripe'; };
  function setRule(s, at, r) {
    if (r === 'keep') return keep(s, at, true);
    keep(s, at, false); s.rule = s.rule || {};
    if (r === 'vintage') s.rule[groupOf(at)] = 'vintage'; else delete s.rule[groupOf(at)];
    return true;
  }
  // an old save's shelves (from before batches): every wheel on a shelf takes the place of its oldest one
  function syncShelves(s) {
    for (let n = 0; n < 3; n++) {
      const ws = []; for (let i = n * 4; i < n * 4 + 4; i++) if (s.slots[i]) ws.push(s.slots[i]);
      if (!ws.length) continue;
      const o = ws.reduce((a, b) => (b.age > a.age ? b : a));
      for (const w of ws) Object.assign(w, { kind: o.kind, age: o.age, q: o.q, due: o.due, next: o.next, keep: o.keep });
      const old = s.label; for (let i = n * 4; i < n * 4 + 4; i++) if (old[i] && !old['sh' + n]) old['sh' + n] = old[i];
    }
    for (let i = 0; i < SLOTS; i++) delete s.label[i];
    s.v = 3;
  }

  // ---- notes at the grating: callers write for a cheese they want and pay well; up to three wait until served ----
  // (until 2026-10-06 one caller at a time waited a few minutes and left, and the pigeon post served them: the owner found
  // the mid game had nothing left to do.) One of each kind: `now` a cheese already on your shelves; `batch` a few ripe
  // wheels of a cheese, one the shelves are not making if there is one; `long` a ripe cheese from the rooms below, or a
  // Vintage one from a shelf. Nothing expires. When Pip would sell a wheel a note wants, he puts it by in the note instead
  // (the shelf carries on), and the note waits for you to hand it over.
  const N_ = () => C.notes;
  const shelfKinds = (s) => C.order.filter((k) => s.learned[k] && k !== 'curd' && !C.cheeses[k].long);
  const longKinds = (s) => C.order.filter((k) => s.learned[k] && C.cheeses[k].long);
  const servedAll = (s) => (s.life.served || 0) + (s.stats.served || 0);
  const SHAPES = ['now', 'batch', 'long'];
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const noteNeed = (n) => { const c = C.cheeses[n.kind]; return n.want === 'vintage' ? 3 * c.peak : c[n.want]; };
  const noteGap = (s, sec) => sec / (cellarOf(s).calls || 1) / (grade(s, 'pigeon') >= 2 ? 2 : 1);
  function stepNotes(s) {
    if (!reached(s, C.at.callers)) return;
    s.notes = s.notes || []; s.noteNext = s.noteNext || {};
    // the first note asks for a cheese on your shelves; the other two kinds start once it is served
    for (const sh of servedAll(s) ? SHAPES : ['now']) {
      if (s.notes.some((n) => n.shape === sh) || s.t < (s.noteNext[sh] || 0)) continue;
      const n = postNote(s, sh); if (!n) { s.noteNext[sh] = s.t + 30; continue; }
      s.notes.push(n); s.notes.sort((x, y) => SHAPES.indexOf(x.shape) - SHAPES.indexOf(y.shape));
      s.ev.push({ t: 'caller', kind: n.kind, who: n.who, shape: sh });
    }
  }
  function postNote(s, sh) {
    const K = N_().shapes[sh], used = s.notes.map((n) => n.kind);
    const onShelf = [...new Set(s.slots.filter((w) => w && w.kind !== 'curd').map((w) => w.kind))];
    const other = (a) => { const b = a.filter((k) => !used.includes(k)); return b.length ? b : a; };
    let kind, want = 'peak';
    if (sh === 'now') { const a = servedAll(s) && !onShelf.length ? shelfKinds(s) : onShelf; if (!a.length) return null; kind = pick(other(a)); want = 'ready'; }
    else if (sh === 'batch') { const a = shelfKinds(s); if (!a.length) return null; const off = a.filter((k) => !onShelf.includes(k)); kind = pick(other(off.length ? off : a)); }
    else {
      const L = longKinds(s), V = shelfKinds(s); if (!L.length && !V.length) return null;
      if (L.length && (!V.length || Math.random() < 0.5)) kind = pick(other(L)); else { kind = pick(other(V)); want = 'vintage'; }
    }
    return { shape: sh, kind, want, n: K.n, got: 0, v: 0, who: pick(N_().who.map((x, k) => k).filter((k) => !s.notes.some((m) => m.who === k))), mult: K.mult };
  }
  // what the cellar earns a second, shelves and racks, when every wheel is sold at its best: a note's few minutes of
  // takings match the "a minute" figure at the top, early and late
  function cellarRate(s) {
    let r = 0;
    for (const at of places(s)) { const w = get(s, at); if (!w) continue; r += peakWorth(s, w.kind, w.q) * rate(s, w.kind, at) / C.cheeses[w.kind].peak; }
    return r;
  }
  // the same for the shelves alone
  function shelfRate(s) {
    let r = 0;
    for (let i = 0; i < SLOTS; i++) { const w = s.slots[i]; if (!w) continue; const c = C.cheeses[w.kind]; r += peakWorth(s, w.kind, w.q) * rate(s, w.kind, i) / c.peak; }
    return r;
  }
  // a note pays `mult` times its wheels' worth, never less than its few minutes of the shelves' takings; the pigeon post more
  const payMult = (s) => (grade(s, 'pigeon') >= 3 ? MACH.pigeon.pay[1] : grade(s, 'pigeon') >= 1 ? MACH.pigeon.pay[0] : 1);
  // the least a note pays is a few minutes of the cellar's takings NOW, not when it was written (owner, 2026-10-08: a note
  // written in a big cellar and carried through the sale paid 2 million in the new one, skipping its whole climb)
  // (the cellar's best rate so far, not this second's: it dipped whenever a batch sold and went on again, and the notes'
  // prices jumped up and down with it; owner, 2026-10-08)
  const noteFloor = (s, n) => { const K = N_().shapes[n.shape]; return K ? Math.round(K.min * 60 * Math.max(s.rateHi || 0, cellarRate(s))) : 0; };
  const notePay = (s, n, v) => Math.round(Math.max(v * n.mult, noteFloor(s, n)) * payMult(s));
  // what a note pays: one price, its wheels just as it asks, whatever wheels are handed over (owner, 2026-10-08: the
  // price followed the wheels as they ripened and jumped as batches sold; now it only rises as the cellar's worth does)
  const noteOffer = (s, n) => notePay(s, n, worthAt(s, n.kind, noteNeed(n), 0) * n.n);
  const noteFits = (s, n, w) => !!(n && w && n.got < n.n && w.kind === n.kind && w.age >= noteNeed(n) - 1e-9);
  // the first note a wheel would serve, or -1
  const noteFor = (s, w) => (s.notes || []).findIndex((n) => noteFits(s, n, w));
  // the places whose wheels would complete note i: the shelf `prefer` first, then wheels not kept, then the best;
  // [] if Pip has put by all it needs, null if there are not enough yet
  function placesFor(s, i, prefer) {
    const n = (s.notes || [])[i]; if (!n) return null;
    const need = n.n - n.got; if (need <= 0) return [];
    const ps = places(s).filter((at) => noteFits(s, n, get(s, at)));
    const pri = (at) => (prefer !== undefined && groupOf(at) === groupOf(prefer) ? 2 : 0) + (get(s, at).keep ? 0 : 1);
    ps.sort((a, b) => pri(b) - pri(a) || worth(s, get(s, b)) - worth(s, get(s, a)));

  const noteReady = (s, i) => placesFor(s, i) !== null;

  // leaves to go Vintage, or a kept one)
  function noteWhen(s, i) {

  // Pip, about to sell a batch, first puts by in its note any wheels a note wants

    if (took && !batchOf(s, at).length) culture(s, w0, 'pip');   // the batch's one chance of a making (sell() has none left to sell)
  }
  // hand note i over: the wheels Pip put by and any more it needs from the shelves and racks (the shelf `prefer` first)
  function give(s, i, prefer, by) {
    const n = (s.notes || [])[i], ps = placesFor(s, i, prefer); if (!n || !ps) return 0;

    const paid = noteOffer(s, n); pay(s, paid);

    s.noteNext[n.shape] = s.t + noteGap(s, N_().shapes[n.shape].again);
    if (first) { s.noteNext.batch = s.t + 60; s.noteNext.long = s.t + 180; }
    // a coin figure from each place a wheel left; the whole sum is said once, with the caller's thanks
    let left = paid;
    taken.forEach(({ w, at }, k) => { const c = k === taken.length - 1 ? left : Math.round(paid / taken.length); left -= c; ev(s, { t: 'sold', kind: w.kind, stg: stage(w.kind, w.age), coins: c, by, caller: k === taken.length - 1 ? n.who : undefined, paid }, at); });
    if (!taken.length) s.ev.push({ t: 'sold', kind: n.kind, stg: n.want === 'vintage' ? 'vintage' : 'peak', coins: paid, by, caller: n.who, paid });
    // a shelf emptied by the note makes its cheese again, as after a sale by hand
    for (const { w, at } of taken) if (!isRack(at) && !batchOf(s, at).length) again(s, at, w.kind, by);
    return paid;
  }
  // send note i off: another of its kind comes later. Wheels Pip had put by for it are sold at their worth
  function sendOff(s, i) {
    const n = (s.notes || [])[i]; if (!n) return false;
    if (n.got) { pay(s, n.v); for (let k = 0; k < n.got; k++) tally(s, { kind: n.kind }, Math.round(n.v / n.got)); s.ev.push({ t: 'sold', kind: n.kind, stg: 'peak', coins: n.v, by: 'note' }); }
    if (N_().who[n.who] === 'the Vicar') s.life.sentVicar = true;
    s.notes.splice(i, 1); s.noteNext[n.shape] = s.t + noteGap(s, N_().off); return true;
  }

  // ---- buying ----
  const slotCost = (s) => C.slotCost[s.open - C.startSlots];
  function buySlot(s) {
    const cost = slotCost(s); if (cost === undefined || s.coins < cost) return false;
    s.coins -= cost; s.open++; s.ev.push({ t: 'slot', i: C.slotOrder[s.open - 1] }); return true;
  }
  const rackCost = (s, id) => { const c = CH[id], h = s.ch[id]; return h.n >= c.racks ? undefined : Math.round(c.rackCost * Math.pow(c.rackGrow, h.n - c.start)); };
  function buyRack(s, id) {
    if (!chamberOpen(s, id)) return false;
    const cost = rackCost(s, id); if (cost === undefined || s.coins < cost) return false;
    s.coins -= cost; s.ch[id].n++; s.ev.push({ t: 'rack', id }); return true;
  }
  // digging out a chamber: pay, then it takes real time (it carries on while you are away)
  const canDig = (s, id) => { const c = CH[id], h = s.ch[id]; return !!c.dig && !h.dug && h.digEnd === null && c.opens(s); };
  function dig(s, id) {
    if (!canDig(s, id) || s.coins < CH[id].dig.cost) return false;
    s.coins -= CH[id].dig.cost; s.ch[id].digEnd = s.t + CH[id].dig.sec; s.ev.push({ t: 'digging', id }); return true;
  }
  const nextApprentice = (s) => C.apprentices.find((a) => !s.hired[a.id] && reached(s, a.stage || 1));
  function hire(s, id) {
    const a = C.apprentices.find((x) => x.id === id);
    if (!a || s.hired[id] || !reached(s, a.stage || 1) || s.coins < a.cost) return false;
    s.coins -= a.cost; s.hired[id] = true; s.busy[id] = 1; s.ev.push({ t: 'hired', id }); return true;
  }
  const nextRecipe = (s) => C.order.find((k) => !s.learned[k] && !C.cheeses[k].house);
  // a long cheese's page can only be finished once there is a chamber to age it in
  const recipeReady = (s, kind) => { const c = C.cheeses[kind], n = c.needs; return reached(s, c.stage || 1) && (!n || chamberOpen(s, n)); };
  function learn(s, kind) {
    const c = C.cheeses[kind];
    if (!c || s.learned[kind] || nextRecipe(s) !== kind || !recipeReady(s, kind) || s.coins < c.learn) return false;
    s.coins -= c.learn; s.learned[kind] = true;
    // a new shelf cheese takes over the spaces that were making curd (curd is only ever the stopgap); one that minds its
    // air, once the air matters, is placed by the player from the new-cheese card instead (design review part 3)
    let moved = 0;
    if (!c.long && !(c.clim && climateOpen(s))) for (let n = 0; n < 3; n++) { const m = members(s, n * 4); if (m.length && labelOf(s, m[0]) === 'curd' && rate(s, kind, n * 4) === 1) { s.label['sh' + n] = kind; moved++; } }
    s.ev.push({ t: 'learned', kind, moved }); return true;
  }
  // a better recipe: each level adds refine.step to every cheese's worth; the price grows by refine.grow each time.
  // (`kind` is accepted and ignored, for old callers.) Old saves had a level per cheese: they keep the highest.
  const refineCost = (s) => Math.round(C.refine.base * Math.pow(C.refine.grow, recipeLv(s)));
  function refine(s) {
    const cost = refineCost(s); if (s.coins < cost) return false;
    s.coins -= cost; s.lv.all = recipeLv(s) + 1; s.ev.push({ t: 'refined', lv: s.lv.all }); return true;
  }
  const cheapestRefine = (s) => ({ kind: 'all', cost: refineCost(s) });
  function syncRecipes(s) { if (s.lv.all === undefined) { const m = Math.max(0, ...Object.values(s.lv)); s.lv = { all: m }; } }
  // the shelves' air matters from the Cave air stage on
  const climateOpen = (s) => reached(s, C.at.climate);

  // ---- the Roll of Honours (C.honours): each test is tried about once a second; a new one is an event for the page ----
  const wheelsSold = (s) => Object.values(s.life.sold).reduce((a, n) => a + n, 0);
  const cellarsSeen = (s) => new Set([...(s.life.cellars || []), s.cellar || 'old']).size;
  const basePages = (s) => C.order.filter((k) => !C.cheeses[k].house && s.learned[k]).length;
  const honoured = (s, id) => !!(s.life.honours && s.life.honours[id]);
  function checkHonours(s) {
    const H = (s.life.honours = s.life.honours || {});
    for (const h of C.honours || []) {
      if (H[h.id]) continue;
      let ok = false; try { ok = !!h.test(s, root.CL); } catch (e) { ok = false; }
      if (ok) { H[h.id] = Object.keys(H).length + 1; s.ev.push({ t: 'honour', id: h.id }); }
    }
    s.life.honourN = (C.honours || []).filter((h) => H[h.id] && !h.secret).length;
  }

  // ---- selling the cellar (the reset): reputation from this cellar's takings; the Book, stars and rosettes stay ----
  // what the old cellar is still owed at a sale: wheels Pip put by for notes and wheels waiting at the Show are sold with
  // it (owner, 2026-10-08: carried over, the Show paid an old cellar's wheels and prizes in the new one, as the notes had)
  const owed = (s) => (s.notes || []).reduce((a, n) => a + (n.v || 0), 0) + Object.values((s.show && s.show.entries) || {}).reduce((a, e) => a + (e.worth || 0), 0);
  const repGain = (s) => Math.floor(Math.sqrt((s.earned + owed(s)) / C.rep.per));
  const retireOpen = (s) => reached(s, C.at.retire) || s.life.runs > 0;
  const canRetire = (s) => retireOpen(s) && repGain(s) >= 1;
  // the cellars on offer when this one is sold: every one but the Old Cellar and this one
  const cellarOffer = (s) => C.cellars.map((c) => c.id).filter((id) => id !== 'old' && id !== s.cellar);
  function retire(s, to) {
    if (!canRetire(s)) return null;
    const offer = cellarOffer(s);
    const gain = repGain(s), life = s.life;

    // Show entries are still judged (places, rosettes, parts) but the prize money stays with the cellar that made them
    if (s.show) for (const k in s.show.entries) { const e = s.show.entries[k]; if (e.worth) pay(s, e.worth); e.worth = 0; e.carried = true; }

    if (firstSale) life.parts = Math.max(life.parts, C.machines[0].grades[0]);   // the first machine is always within reach
    const n = newState(); n.life = life; n.seen = s.seen;
    // the notes follow you to the next cellar (the callers know the family), their clocks with them
    n.notes = s.notes || []; n.noteNext = {}; for (const k in s.noteNext || {}) n.noteNext[k] = Math.max(0, s.noteNext[k] - s.t);
    // the rooms below and their racks come along, empty: their wheels go with the cellar (owner, 2026-10-08: carried over,
    // they earned ~170x the new shelves and the new cellar's climb was skipped; selling up is a prestige, the climb comes again)
    n.ch = s.ch; for (const id in n.ch) n.ch[id].r = n.ch[id].r.map(() => null); for (const k in s.label) if (k.includes(':')) n.label[k] = s.label[k];
    for (const k in s.rule || {}) if (k.includes(':')) n.rule[k] = s.rule[k];
    for (const id in n.ch) if (n.ch[id].digEnd !== null) n.ch[id].digEnd -= s.t;   // the new cellar's clock starts at 0

    n.learned = Object.assign({}, s.learned); // the Book goes with you: every page stays written
    n.show = s.show; n.lastShow = s.lastShow;   // and so do your Show entries and results
    // family secrets: what this family knows from the start
    const sec = life.secrets;
    if (sec.moss) n.hired.moss = true;

    if (rk) cards.push({ id: 'rack', img: benchPic(ART.mrack), nm: `A rack: ${rk.name.replace(/^The /, '')}`, ds: `One more long cheese ageing.<span class="nw"> &middot; ${s.ch[rk.id].n} of ${rk.racks}</span>`, cost: CL.rackCost(s, rk.id), buy: () => CL.buyRack(s, rk.id) });

  }
  // roughly how long until the purse reaches a price at the present takings (coarse, so the card does not tick)
  function etaFor(cost) {
    if (s.coins >= cost || rateNow <= 0) return '';
    const sec = (cost - s.coins) / rateNow;
    return sec < 60 ? 'in under a minute' : sec < 5400 ? `in about ${Math.round(sec / 60)} min` : sec < 129600 ? `in about ${Math.round(sec / 3600)} h` : '';
  }
  function refinePlan() {
    let left = s.coins, cost = 0, n = 0, lv = CL.recipeLv(s);
    for (; n < 200; n++) { const c = Math.round(C.refine.base * Math.pow(C.refine.grow, lv + n)); if (c > left) break; left -= c; cost += c; }
    return { n, cost };
  }
  function refreshBench(force) {
    if (!cellarSeen()) return;
    // a hire card makes room by hiding the next page, unless that page is what the goal line is asking for
    const g = CL.goal(s), wantLearn = g && g.steps.some((x) => !x.done && x.st.t === 'learn');
    let all = benchCards(); if (all.some((c) => c.id === 'hire') && !wantLearn) all = all.filter((c) => c.id !== 'learn');
    let cards = all.slice(0, 3);
    { const keep = cards.map((_, i) => cards.find((c) => c.id === benchIds[i]) || null), rest = cards.filter((c) => !keep.includes(c));
      cards = keep.map((c) => c || rest.shift()); }   // (a player bought the wrong card where a vanished one had been)
    // room to spare: a card that shows the next thing to work towards (the next Book page, or the nearest star)
    let goal = '';
    if (cards.length < 3) {
      const nr = CL.nextRecipe(s);
      if (nr && !cards.some((c) => c.id === 'learn') && !CL.goal(s)) {
        const c = C.cheeses[nr], f = Math.min(1, s.coins / c.learn);
        goal = `<div class="card goal"><span class="nm">Next in the Book</span><span class="ds">${c.name}${CL.recipeReady(s, nr) ? '' : c.needs && CL.reached(s, c.stage || 1) ? `, once ${CL.CH[c.needs].name} is open` : `, at stage ${c.stage}`}</span><span class="bar"><i style="width:${f * 100}%"></i></span><span class="buy"><span class="lead"></span>${coinImg()}${fmt(c.learn)}</span></div>`;
      } else {
        const k = C.order.filter((x) => s.learned[x] && CL.nextStar(s, x)).sort((x, y) => (s.life.sold[y] || 0) / CL.nextStar(s, y) - (s.life.sold[x] || 0) / CL.nextStar(s, x))[0];
        if (k) goal = `<div class="card goal"><span class="nm">The next star</span><span class="ds">${C.cheeses[k].name}: ${fmt(s.life.sold[k] || 0)} of ${fmt(CL.nextStar(s, k))} sold</span><span class="bar"><i style="width:${(s.life.sold[k] || 0) / CL.nextStar(s, k) * 100}%"></i></span></div>`;
      }
    }
    const sig = cards.map((c) => c.id + c.nm + c.cost + (s.coins >= c.cost) + etaFor(c.cost)).join() + settings.sci + goal + JSON.stringify(settings.keys || '');
    shownBench = cards;
    if (sig === benchSig && !force) return; benchSig = sig;
    $('bench').innerHTML = cards.map((c, i) => `<button class="card ${s.coins >= c.cost ? 'can' : 'cant'}" data-id="${c.id}"><span class="key">${keyLab('bench' + (i + 1))}</span><span class="nm">${c.nm}</span><span class="ds">${c.ds}</span>${s.coins < c.cost && etaFor(c.cost) ? `<span class="eta">${etaFor(c.cost)}</span>` : ''}<span class="buy">${c.img || ''}<span class="lead"></span><span class="p">${coinImg()}${fmt(c.cost)}</span></span></button>`).join('')
      + goal;
    // a card that has just slid into a place takes no tap for a moment, so a quick second tap meant for the card
    // that was there does not buy the new one (the same card stays tappable: two quick taps buy two recipes)
    cards.forEach((c, i) => { if (benchIds[i] !== c.id) benchBorn[i] = wall(); });
    benchIds = cards.map((c) => c.id);
    $('bench').querySelectorAll('.card[data-id]').forEach((b, i) => b.onclick = () => {
      snd.unlock(); if (wall() - (benchBorn[i] || -9) < 0.8) return;
      const c = cards.find((x) => x.id === b.dataset.id);
      if (c && c.buy()) { afterAction(); refreshBench(true); } else snd.sfx('no');
    });
  }
  const starsHtml = (k) => { const n = CL.stars(s, k); return n ? `<span class="stars">${MARK.star.repeat(n)}</span>` : ''; };
  function bookRow(k) {
    const c = C.cheeses[k], best = s.life.best[k], next = CL.nextStar(s, k), ros = s.life.rosettes[k];
    return `<div class="rowc"><div class="pic">${cheeseThumb(k, 'peak', 60)}</div><div class="grow"><div class="nm">${c.name}${starsHtml(k)}${climTag(k)}</div><div class="ds">${c.info}</div>
      <div class="num">${nums(k)}</div>
      <div class="num">${fmt(s.life.sold[k] || 0)} sold${next ? `, next star at ${fmt(next)}` : ', every star'}${ros ? ` &middot; ${ros} rosette${ros > 1 ? 's' : ''}${ros > C.rosetteMax ? ` (${C.rosetteMax} count)` : ''}` : ''}</div></div></div>`;
  }
  function rollRow() {
    const H = s.life.honours || {}, won = C.honours.filter((h) => H[h.id]).length, last = C.honours.filter((h) => H[h.id]).sort((a, b) => H[b.id] - H[a.id])[0];

      <div class="acts"><button class="btn chip" data-roll="1">Read the Roll${PHONE ? '' : `<span class="key">${keyLab('honours')}</span>`}</button></div></div></div>`;
  }
  function renderBook() {
    const base = C.order.filter((k) => !C.cheeses[k].house), learnedN = base.filter((k) => s.learned[k]).length, nr = CL.nextRecipe(s);

          <div class="num">${nums(k)}</div><div class="acts">${ready ? `<button class="btn${ok ? ' red' : ''}" data-learn="${k}"${ok ? '' : ' disabled'}>Finish this page ${coinImg()}${fmt(c.learn)}<span class="key">${keyLab('page')}</span></button>` : `<span class="small">${CL.reached(s, c.stage || 1) ? `Needs ${CL.CH[c.needs].name} first (the Map).` : `Opens at stage ${c.stage}: ${C.stages[c.stage - 1].name}.`}</span>`}</div></div></div>`;

      <div class="acts"><button class="btn${rok ? ' red' : ''}" data-ref="1"${rok ? '' : ' disabled'}>Recipe no. ${lv + 1}: +${Math.round(C.refine.step * 100)}% ${coinImg()}${fmt(rc)}</button></div></div></div>`;
    let house = '';
    if (CL.reached(s, C.at.cultures)) {
      house = `<h3>House cheeses</h3><div class="sub">Cheeses of your own invention: ${CL.houseCount(s)} of ${C.house.length} made. A very old wheel, sold, leaves a making behind now and then, about every day and a bit (a mould, a wrapping, a wash). Put it on the right cheese at the makings shelf, in the Workshop at the bottom of the Map, and you have a new cheese worth ${C.houseWorth} times its parent, yours for good.</div>`
        + C.house.map((h) => {
          if (s.learned[h.id]) return bookRow(h.id);
          const held = s.life.cultures[h.culture], cu = C.cultures.find((x) => x.culture === h.culture || x.id === h.culture);
          return `<div class="rowc dim"><div class="pic">${held ? `<img src="${CULT[h.culture]}" alt="" style="width:44px">` : ''}</div><div class="grow"><div class="nm">?</div><div class="ds">${held ? `You hold ${cu.name.toLowerCase()}. ${cu.hint}` : 'Not found yet.'}</div></div></div>`;
        }).join('');

        + [0, 1, 2, 3].map((j) => { const x = C.seasons[(at + j) % 4], k = C.cheeses[x.cheese], have = Math.min(x.n, L.n[x.id] || 0);   // from the season now

    $('panel').querySelectorAll('[data-learn]').forEach((b) => b.onclick = () => { snd.unlock(); if (CL.learn(s, b.dataset.learn)) { afterAction(); renderBook(); } });

  // every stage card met so far, the helpers' cards and the keys, to read again (owner, 2026-10-08: "a book of everything

  // the Workshop: machines bought with parts, kept for good (second act)

      <div class="rowc"><div class="grow"><div class="nm">${parts} part${parts === 1 ? '' : 's'} on the bench</div><div class="ds">The master cellar: ${CL.reached(s, C.at.cultures) ? `house cheeses ${CL.houseCount(s)} of ${C.house.length} &middot; ` : ''}machine grades ${C.machines.reduce((a, m) => a + CL.grade(s, m.id), 0)} of ${C.machines.reduce((a, m) => a + m.grades.length, 0)}</div></div></div>${rows}${cultureShelf()}`;

    for (let n; (n = first.filter((im) => im.ok || im.bad).length) < first.length && Date.now() - t0 < 20000;) {
      if (bar) bar.style.width = (100 * n / first.length).toFixed(0) + '%';
      await new Promise((r) => setTimeout(r, 100));
    }
    loadRest();
    // the title page: the cellar runs behind it; its button is the tap that may start the sound (browsers want one)
    const go = () => {
      requestAnimationFrame(frame);
      const L = $('loading'), open = () => { snd.unlock(); snd.sfx('door', 0.7); L.classList.add('out'); setTimeout(() => L.remove(), 400); };
      if (DEBUG) { L.remove(); return; }
      // straight into the cellar (owner, 2026-10-08: CrazyGames counted the title page as load time, 12.6 s, and only 28% were
      // still playing after a minute); only GameDistribution keeps the button, for the advert it requires before play.
      // The first tap anywhere starts the sound
      if (!window.GD_GAME_ID) { L.classList.add('out'); setTimeout(() => L.remove(), 400); return; }
      L.classList.add('ready'); $('go').onclick = () => { snd.unlock(); portal.preroll(open); }; // GameDistribution's advert comes first
    };
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(go, go);
    document.addEventListener('pointerdown', () => snd.unlock(), { capture: true });
  }
  // debug hooks for the test tools (#debug in the address)
  if (DEBUG) window.__cl = { openRoll: () => openRoll(), honourQ,
    get s() { return s; }, set s(v) { s = v; }, CL, C, settings, geo: () => geo,
    advance(sec) { const n = Math.ceil(sec / 0.1); for (let k = 0; k < n; k++) tick(0.1); draw(); return { t: s.t, coins: s.coins }; },
    tap: (i) => tapSlot(i), setTab, openOptions, closeModal, closePop, modalOpen: () => modalOpen, offline: (sec) => { const o = CL.offline(s, sec); if (o) awayCard(o); return o; },
    slotXY: (i) => geo.slots[i], save, openWardrobe, showResults, refresh, actors: () => actors, crane: () => crane, M: () => M,
    judgeNow: () => { if (s.show) { s.show.due = Date.now() - 1; showTick(); } },
    stopSaving: () => { wiping = true; },
  };
  start();
})();
